<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Начисление очков - Фэнтези Лига</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="loadingScreen">
      <div style="font-size: 28px; margin-bottom: 20px;">⏳ Загрузка...</div>
      <div class="spinner"></div>
    </div>

    <div id="mainContent" class="hidden">
      <div class="header">
        <div>
          <h1>🎯 Начисление очков</h1>
          <p class="subtitle">Администрирование</p>
        </div>
        <nav class="nav">
          <a href="/admin.html">⚙️ Админ</a>
          <a href="/rankings.html">🏅 Рейтинги</a>
        </nav>
      </div>

      <!-- Выбор события -->
      <div class="card">
        <h2>📅 Выберите событие</h2>
        <div class="form-group">
          <select id="eventSelect" class="form-control" onchange="loadEventPlayers()">
            <option value="">-- Выберите событие --</option>
          </select>
        </div>
      </div>

      <!-- Список спортсменов с очками -->
      <div id="playersSection" class="hidden">
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <h2 style="margin: 0;"> Спортсмены события</h2>
            <button class="btn btn-success" onclick="saveAllScores()">
              💾 Сохранить все очки
            </button>
          </div>

          <div class="search-box">
            <input type="text" id="searchInput" placeholder=" Поиск по имени или команде..." oninput="filterPlayers()">
          </div>

          <div id="playersList"></div>
        </div>

        <!-- Текущий рейтинг команд -->
        <div class="card" style="margin-top: 20px;">
          <h2>🏆 Рейтинг команд</h2>
          <div id="teamsRating"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let vkUserInfo = null;
    let events = [];
    let currentEventId = null;
    let players = [];
    let scores = {};

    async function init() {
      try {
        try {
          await vkBridge.send('VKWebAppInit', {});
          const userData = await vkBridge.send('VKWebAppGetUserInfo', {});
          vkUserInfo = userData;
        } catch (vkError) {
          vkUserInfo = { id: 416323498, first_name: 'Тест', last_name: 'Пользователь' };
        }

        if (vkUserInfo.id !== 416323498) {
          alert('Доступ запрещён');
          window.location.href = '/';
          return;
        }

        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');

        await loadEvents();
      } catch (error) {
        console.error('Ошибка:', error);
      }
    }

    async function loadEvents() {
      const res = await fetch('/api/events');
      events = await res.json();

      const select = document.getElementById('eventSelect');
      events.forEach(event => {
        const option = document.createElement('option');
        option.value = event.id;
        option.textContent = `${event.name} (${event.status === 'active' ? '🔥 активно' : '⏸ завершено'})`;
        select.appendChild(option);
      });
    }

    async function loadEventPlayers() {
      const eventId = document.getElementById('eventSelect').value;
      if (!eventId) {
        document.getElementById('playersSection').classList.add('hidden');
        return;
      }

      currentEventId = eventId;
      scores = {};

      const res = await fetch(`/api/events/${eventId}/players`);
      players = await res.json();

      // Инициализируем очки
      players.forEach(p => {
        scores[p.id] = p.points || 0;
      });

      document.getElementById('playersSection').classList.remove('hidden');
      renderPlayers();
      loadTeamsRating();
    }

    function renderPlayers(filteredPlayers = null) {
      const list = filteredPlayers || players;
      const container = document.getElementById('playersList');

      if (list.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px;">Нет спортсменов</p>';
        return;
      }

      let html = '<div class="table-wrapper"><table><thead><tr><th>Спортсмен</th><th>Регион</th><th>Разряд</th><th>Очки</th></tr></thead><tbody>';

      list.forEach(player => {
        html += `
          <tr>
            <td>
              <strong>${player.full_name}</strong>
              <br>
              <small style="color: var(--text-muted);">${player.birth_year} г.р. • ${player.gender === 'male' ? '♂' : '♀'}</small>
            </td>
            <td>${player.team}</td>
            <td><span class="badge badge-primary">${player.rank || '-'}</span></td>
            <td>
              <input type="number" 
                     class="form-control" 
                     style="width: 100px; text-align: center; font-size: 18px; font-weight: bold;"
                     value="${scores[player.id] || 0}" 
                     min="0"
                     onchange="updateScore(${player.id}, this.value)"
                     oninput="updateScore(${player.id}, this.value)">
            </td>
          </tr>
        `;
      });

      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    function updateScore(playerId, value) {
      scores[playerId] = parseInt(value) || 0;
    }

    function filterPlayers() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = players.filter(p =>
        p.full_name.toLowerCase().includes(search) ||
        p.team.toLowerCase().includes(search)
      );
      renderPlayers(filtered);
    }

    async function saveAllScores() {
      if (!currentEventId) {
        alert('Выберите событие');
        return;
      }

      const results = Object.entries(scores).map(([player_id, points]) => ({
        player_id: parseInt(player_id),
        points: points
      }));

      try {
        const res = await fetch(`/api/events/${currentEventId}/results/batch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ results })
        });

        if (res.ok) {
          showNotification('✅ Очки успешно сохранены!');
          await loadEventPlayers(); // Перезагружаем данные
        } else {
          const err = await res.json();
          alert('Ошибка: ' + err.error);
        }
      } catch (error) {
        alert('Ошибка: ' + error.message);
      }
    }

    async function loadTeamsRating() {
      if (!currentEventId) return;

      const res = await fetch(`/api/events/${currentEventId}/teams`);
      const teams = await res.json();

      const container = document.getElementById('teamsRating');

      if (teams.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">Нет команд</p>';
        return;
      }

      let html = '<div class="table-wrapper"><table><thead><tr><th>Место</th><th>Команда</th><th>Очки</th></tr></thead><tbody>';

      teams.forEach((team, index) => {
        let place = index + 1;
        let placeDisplay = place;
        if (place === 1) placeDisplay = '🥇 1';
        else if (place === 2) placeDisplay = ' 2';
        else if (place === 3) placeDisplay = '🥉 3';

        html += `
          <tr>
            <td><strong>${placeDisplay}</strong></td>
            <td><strong>${team.user_name}</strong></td>
            <td><strong style="font-size: 18px; color: var(--primary);">${team.total_points || 0}</strong></td>
          </tr>
        `;
      });

      html += '</tbody></table></div>';
      container.innerHTML = html;
    }

    function showNotification(message) {
      const notification = document.createElement('div');
      notification.className = 'alert alert-success';
      notification.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 300px; animation: slideIn 0.3s ease;';
      notification.innerHTML = `<strong>${message}</strong>`;
      document.body.appendChild(notification);
      setTimeout(() => notification.remove(), 3000);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
