<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>События - Фэнтези Лига</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Экран загрузки -->
    <div id="loadingScreen">
      <div style="font-size: 28px; margin-bottom: 20px;">⏳ Загрузка...</div>
      <div class="spinner"></div>
      <p style="font-size: 16px; opacity: 0.9;">Подключение к VK</p>
    </div>

    <!-- Основной контент -->
    <div id="mainContent" class="hidden">
      <div class="header">
        <div>
          <h1> События</h1>
          <p class="subtitle">Спортивный туризм</p>
        </div>
        <nav class="nav">
          <a href="/"> Главная</a>
          <a href="/rankings.html">🏅 Рейтинги</a>
          <a href="/admin.html" id="adminLink" class="hidden">⚙️ Админ</a>
        </nav>
      </div>

      <!-- Активные события -->
      <div class="card">
        <h2>🔥 Активные события</h2>
        <div id="activeEvents"></div>
      </div>

      <!-- Все события -->
      <div class="card">
        <h2>📋 Все события</h2>
        <div id="allEvents"></div>
      </div>
    </div>
  </div>

  <script>
    let vkUserInfo = null;
    let vk_id = null;

    // Инициализация
    async function init() {
      try {
        console.log('🚀 Инициализация...');
        
        // Пробуем инициализировать VK Bridge
        try {
          await vkBridge.send('VKWebAppInit', {});
          console.log('✅ VK Bridge инициализирован');
          
          // Получаем данные пользователя
          const userData = await vkBridge.send('VKWebAppGetUserInfo', {});
          vkUserInfo = userData;
          vk_id = userData.id;
          console.log('👤 Пользователь:', userData);
        } catch (vkError) {
          console.warn('⚠️ VK Bridge недоступен, используем тестовый режим');
          // Тестовый режим - для отладки вне VK
          vk_id = 416323498; // Замените на ваш VK ID
          vkUserInfo = { id: vk_id, first_name: 'Тест', last_name: 'Пользователь' };
        }

        // Скрываем загрузку
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');

        // Проверяем админа
        if (vk_id === 416323498) {
          document.getElementById('adminLink').classList.remove('hidden');
        }

        // Загружаем события
        await loadEvents();
        
      } catch (error) {
        console.error('❌ Ошибка инициализации:', error);
        document.getElementById('loadingScreen').innerHTML = `
          <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
            <h2 style="color: var(--danger-dark); margin-bottom: 15px;">⚠️ Ошибка загрузки</h2>
            <p style="color: var(--danger-dark); margin-bottom: 20px;">${error.message}</p>
            <button onclick="location.reload()" class="btn btn-danger">🔄 Попробовать снова</button>
          </div>
        `;
      }
    }

    // Загрузка событий
    async function loadEvents() {
      try {
        // Загружаем активные события
        const activeRes = await fetch('/api/events/active');
        const activeEvents = await activeRes.json();
        
        // Загружаем все события
        const allRes = await fetch('/api/events');
        const allEvents = await allRes.json();

        console.log('Активные события:', activeEvents);
        console.log('Все события:', allEvents);

        // Отображаем активные
        const activeDiv = document.getElementById('activeEvents');
        if (activeEvents.length === 0) {
          activeDiv.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Нет активных событий</p>';
        } else {
          activeDiv.innerHTML = activeEvents.map(event => `
            <div class="event-card">
              <h3>${event.name}</h3>
              <p>${event.description || ''}</p>
              <div class="dates">
                📅 Регистрация: ${event.registration_start} - ${event.registration_end}<br>
                 Событие: ${event.event_start_date} - ${event.event_end_date}
              </div>
            </div>
          `).join('');
        }

        // Отображаем все события
        const allDiv = document.getElementById('allEvents');
        if (allEvents.length === 0) {
          allDiv.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Нет событий</p>';
        } else {
          allDiv.innerHTML = allEvents.map(event => `
            <div class="event-card" style="background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); color: var(--text-primary);">
              <h3 style="color: var(--text-primary);">${event.name}</h3>
              <p style="color: var(--text-secondary);">${event.description || ''}</p>
              <div class="dates" style="color: var(--text-secondary);">
                📅 Регистрация: ${event.registration_start} - ${event.registration_end}<br>
                 Событие: ${event.event_start_date} - ${event.event_end_date}<br>
                <span class="badge badge-${event.status === 'active' ? 'success' : 'info'}">${event.status}</span>
              </div>
            </div>
          `).join('');
        }

      } catch (error) {
        console.error('Ошибка загрузки событий:', error);
        document.getElementById('activeEvents').innerHTML = `
          <div class="alert alert-error">
             Ошибка загрузки событий: ${error.message}
          </div>
        `;
      }
    }

    // Запуск
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
