<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>События и рейтинги - Фэнтези Лига</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
// Проверка токена при загрузке
window.addEventListener('DOMContentLoaded', async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  
  if (token) {
    localStorage.setItem('vk_token', token);
    window.history.replaceState({}, '', '/');
  }
  
  const savedToken = localStorage.getItem('vk_token');
  
  if (!savedToken) {
    // Перенаправляем на авторизацию
    window.location.href = '/auth/vk';
    return;
  }
  
  // Проверяем токен
  try {
    const res = await fetch('/auth/me', {
      headers: { 'Authorization': `Bearer ${savedToken}` }
    });
    
    if (!res.ok) {
      localStorage.removeItem('vk_token');
      window.location.href = '/auth/vk';
    }
  } catch (error) {
    console.error('Ошибка проверки токена:', error);
  }
});

// Функция для API запросов с токеном
async function apiRequest(url, options = {}) {
  const token = localStorage.getItem('vk_token');
  const headers = {
    'Content-Type': 'application/json',
    ...options.headers
  };
  
  if (token) {
    headers['Authorization'] = `Bearer ${token}`;
  }
  
  const res = await fetch(url, { ...options, headers });
  return res;
}
</script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏆 События и рейтинги</h1>
      <nav>
        <a href="/">👥 Сборка команды</a>
        <a href="/rankings.html">🏅 Рейтинги</a>
        <a href="/admin.html">⚙️ Админ-панель</a>
      </nav>
    </div>

    <!-- Активное событие -->
    <div class="card" id="currentEventSection">
      <h2>🔥 Текущее событие</h2>
      <div id="currentEventContent">
        <p style="color: var(--text-muted);">Загрузка...</p>
      </div>
    </div>

    <!-- Все события -->
    <div class="card">
      <h2>📅 Все события</h2>
      <div id="eventsList"></div>
    </div>

    <!-- Рейтинг за текущее событие -->
    <div class="card">
      <h2>🏅 Рейтинг за текущее событие</h2>
      <div id="currentRankings"></div>
    </div>

    <!-- Рейтинг за все время -->
    <div class="card">
      <h2>👑 Рейтинг за всё время</h2>
      <div id="allTimeRankings"></div>
    </div>

    <!-- Рейтинг спортсменов -->
    <div class="card">
      <h2>⭐ Рейтинг спортсменов</h2>
      <div id="playerRankings"></div>
    </div>
  </div>

  <script>
    // Загрузка данных
    async function loadData() {
      await Promise.all([
        loadCurrentEvent(),
        loadEvents(),
        loadCurrentRankings(),
        loadAllTimeRankings(),
        loadPlayerRankings()
      ]);
    }

    // Текущее событие
    async function loadCurrentEvent() {
      try {
        const res = await fetch('/api/events/current');
        const event = await res.json();

        const container = document.getElementById('currentEventContent');

        if (!event) {
          container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px;">Нет активного события</p>';
          return;
        }

        container.innerHTML = `
          <div style="background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(59,130,246,0.1)); border: 1px solid rgba(139,92,246,0.2); color: var(--text-primary); padding: 24px; border-radius: 12px;">
            <h3 style="font-size: 24px; margin-bottom: 12px; font-weight: 700;">${event.name}</h3>
            ${event.description ? `<p style="margin-bottom: 12px; color: var(--text-secondary);">${event.description}</p>` : ''}
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 6px;">
              📅 Даты события: ${formatDate(event.event_start_date)} — ${formatDate(event.event_end_date)}
            </p>
            <p style="font-size: 14px; color: var(--text-muted);">
              📝 Регистрация: ${formatDate(event.registration_start)} — ${formatDate(event.registration_end)}
            </p>
            <p style="margin-top: 12px; font-size: 13px; background: rgba(139,92,246,0.1); padding: 8px 14px; border-radius: 8px; display: inline-block; color: var(--accent-purple); font-weight: 600;">
              Статус: ${event.status === 'active' ? '🔥 Активно' : event.status === 'completed' ? '✅ Завершено' : '⏳ Предстоит'}
            </p>
          </div>
        `;
      } catch (error) {
        console.error('Ошибка загрузки события:', error);
      }
    }

    // Все события
    async function loadEvents() {
      try {
        const res = await fetch('/api/events');
        const events = await res.json();

        const container = document.getElementById('eventsList');

        if (events.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px;">Нет событий</p>';
          return;
        }

        container.innerHTML = events.map(e => `
          <div class="event-card ${e.status}">
            <div style="flex: 1;">
              <h3 style="font-size: 17px; font-weight: 700; margin-bottom: 6px;">${e.name}</h3>
              <p style="color: var(--text-muted); font-size: 14px;">${e.description || ''}</p>
              <p style="font-size: 13px; color: var(--accent-purple); margin-top: 8px;">
                📅 Событие: ${formatDate(e.event_start_date)} — ${formatDate(e.event_end_date)}
              </p>
              <p style="font-size: 13px; color: var(--accent-green); margin-top: 4px;">
                📝 Регистрация: ${formatDate(e.registration_start)} — ${formatDate(e.registration_end)}
              </p>
            </div>
            <div class="event-status status-${e.status}">
              ${e.status === 'active' ? '🔥 Активно' : e.status === 'completed' ? '✅ Завершено' : '⏳ Предстоит'}
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Ошибка загрузки событий:', error);
      }
    }

    // Рейтинг за текущее событие
    async function loadCurrentRankings() {
      try {
        const res = await fetch('/api/rankings/current');
        const data = await res.json();

        const container = document.getElementById('currentRankings');

        if (!data.event || data.rankings.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px;">Пока нет зарегистрированных команд</p>';
          return;
        }

        container.innerHTML = `
          <table class="ranking-table">
            <thead>
              <tr>
                <th>Место</th>
                <th>Команда</th>
                <th>Очки</th>
              </tr>
            </thead>
            <tbody>
              ${data.rankings.map((r, i) => `
                <tr class="${i < 3 ? 'top-three' : ''}">
                  <td>${getMedal(i + 1)}</td>
                  <td>${r.user_name}</td>
                  <td><strong>${r.total_points}</strong></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        console.error('Ошибка загрузки рейтинга:', error);
      }
    }

    // Рейтинг за всё время
async function loadAllTimeRankings() {
  try {
    const res = await fetch('/api/rankings/all-time');
    const rankings = await res.json();
    
    const container = document.getElementById('allTimeRankings');
    
    if (rankings.length === 0) {
      container.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">Пока нет данных</p>';
      return;
    }

    container.innerHTML = `
      <table class="ranking-table">
        <thead>
          <tr>
            <th>Место</th>
            <th>Команда</th>
            <th>Очки</th>
            <th>Событий</th>
          </tr>
        </thead>
        <tbody>
          ${rankings.map((r, i) => `
            <tr class="${i < 3 ? 'top-three' : ''}">
              <td>${getMedal(i + 1)}</td>
              <td>
                ${r.photo ? `<img src="${r.photo}" style="width: 30px; height: 30px; border-radius: 50%; margin-right: 10px; vertical-align: middle;">` : ''}
                ${r.first_name || r.user_name} ${r.last_name || ''}
              </td>
              <td><strong>${r.total_points}</strong></td>
              <td>${r.events_count}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (error) {
    console.error('Ошибка загрузки рейтинга:', error);
  }
}

    // Рейтинг спортсменов
    async function loadPlayerRankings() {
      try {
        const res = await fetch('/api/rankings/players');
        const rankings = await res.json();

        const container = document.getElementById('playerRankings');

        if (rankings.length === 0) {
          container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 40px;">Пока нет данных</p>';
          return;
        }

        container.innerHTML = `
          <table class="ranking-table">
            <thead>
              <tr>
                <th>Место</th>
                <th>Спортсмен</th>
                <th>Команда</th>
                <th>Разряд</th>
                <th>Очки</th>
                <th>Событий</th>
                <th>Среднее</th>
              </tr>
            </thead>
            <tbody>
              ${rankings.map((r, i) => `
                <tr class="${i < 3 ? 'top-three' : ''}">
                  <td>${getMedal(i + 1)}</td>
                  <td>${r.full_name} ${r.gender === 'male' ? '♂' : '♀'}</td>
                  <td>${r.team}</td>
                  <td>${r.rank}</td>
                  <td><strong>${r.total_points}</strong></td>
                  <td>${r.events_count}</td>
                  <td>${r.avg_points.toFixed(1)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        console.error('Ошибка загрузки рейтинга спортсменов:', error);
      }
    }

    // Форматирование даты
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Медали
    function getMedal(place) {
      if (place === 1) return '🥇';
      if (place === 2) return '🥈';
      if (place === 3) return '🥉';
      return place;
    }

    // Загрузка при старте
    loadData();
  </script>
</body>
</html>
