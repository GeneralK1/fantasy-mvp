<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рейтинги - Фэнтези Лига</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Экран загрузки -->
    <div id="loadingScreen">
      <div style="font-size: 28px; margin-bottom: 20px;">⏳ Загрузка...</div>
      <div class="spinner"></div>
      <p style="font-size: 16px; opacity: 0.9;">Подключение к VK</p>
    </div>

    <!-- Основной контент -->
    <div id="mainContent" class="hidden">
      <div class="header">
        <div>
          <h1>🏅 Рейтинги</h1>
          <p class="subtitle">Спортивный туризм</p>
        </div>
        <nav class="nav">
          <a href="/">🏠 Главная</a>
          <a href="/events.html"> События</a>
          <a href="/admin.html" id="adminLink" class="hidden">⚙️ Админ</a>
        </nav>
      </div>

      <!-- Список событий с рейтингами -->
      <div id="rankingsList"></div>
    </div>
  </div>

  <script>
    let vkUserInfo = null;
    let events = [];
    let refreshInterval = null;

    // Функция форматирования даты
    function formatDate(dateString) {
      if (!dateString) return 'Не указана';
      try {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return 'Не указана';
        return date.toLocaleDateString('ru-RU', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        });
      } catch (e) {
        return 'Не указана';
      }
    }

    // Инициализация
    async function init() {
      try {
        console.log('🚀 Инициализация...');
        
        try {
          await vkBridge.send('VKWebAppInit', {});
          console.log('✅ VK Bridge инициализирован');
          
          const userData = await vkBridge.send('VKWebAppGetUserInfo', {});
          vkUserInfo = userData;
          console.log('👤 Пользователь:', userData);
        } catch (vkError) {
          console.warn('⚠️ VK Bridge недоступен, используем тестовый режим');
          vkUserInfo = { id: 416323498, first_name: 'Тест', last_name: 'Пользователь' };
        }

        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');

        if (vkUserInfo.id === 416323498) {
          document.getElementById('adminLink').classList.remove('hidden');
        }

        await loadRankings();
        
        // Автообновление каждые 5 секунд
        refreshInterval = setInterval(() => {
          loadRankings();
        }, 5000);
        
      } catch (error) {
        console.error('❌ Ошибка инициализации:', error);
        document.getElementById('loadingScreen').innerHTML = `
          <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
            <h2 style="color: var(--danger-dark); margin-bottom: 15px;">⚠️ Ошибка загрузки</h2>
            <p style="color: var(--danger-dark); margin-bottom: 20px;">${error.message}</p>
            <button onclick="location.reload()" class="btn btn-danger">🔄 Попробовать снова</button>
          </div>
        `;
      }
    }

    // Загрузка рейтингов
    async function loadRankings() {
      try {
        const eventsRes = await fetch('/api/events');
        events = await eventsRes.json();
        
        console.log('📦 Загружено событий:', events.length);

        const rankingsDiv = document.getElementById('rankingsList');
        
        if (!events || events.length === 0) {
          rankingsDiv.innerHTML = `
            <div class="card" style="text-align: center; padding: 60px 20px;">
              <div style="font-size: 64px; margin-bottom: 20px;">📭</div>
              <h3 style="color: var(--text-primary); margin-bottom: 10px;">Нет событий</h3>
              <p style="color: var(--text-secondary);">
                В настоящее время нет активных событий
              </p>
            </div>
          `;
          return;
        }

        let html = '';
        
        for (const event of events) {
          try {
            const teamsRes = await fetch(`/api/events/${event.id}/teams`);
            const teams = await teamsRes.json();
            
            html += renderEventRanking(event, teams);
          } catch (error) {
            console.error(`Ошибка загрузки команд для события ${event.id}:`, error);
            html += renderEventRanking(event, []);
          }
        }
        
        rankingsDiv.innerHTML = html;
        
      } catch (error) {
        console.error('Ошибка загрузки рейтингов:', error);
        document.getElementById('rankingsList').innerHTML = `
          <div class="alert alert-error">
            ⚠️ Ошибка загрузки рейтингов: ${error.message}
          </div>
        `;
      }
    }

    // Рендер рейтинга для одного события
    function renderEventRanking(event, teams) {
      const statusBadge = event.status === 'active' 
        ? '<span class="badge badge-success">🔥 Активно</span>'
        : '<span class="badge badge-info"> Завершено</span>';

      let html = `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <h2 style="margin: 0;">🏆 ${event.name}</h2>
            ${statusBadge}
          </div>
          <p style="color: var(--text-secondary); margin-bottom: 5px;">
            📅 ${formatDate(event.event_start_date)} — ${formatDate(event.event_end_date)}
          </p>
          <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">
            Регистрация: ${formatDate(event.registration_start)} — ${formatDate(event.registration_end)}
          </p>
      `;

      if (!teams || teams.length === 0) {
        html += `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            <div style="font-size: 48px; margin-bottom: 15px;">🏆</div>
            <p>Пока нет зарегистрированных команд</p>
          </div>
        `;
      } else {
        html += `
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Место</th>
                  <th>Команда</th>
                  <th>Спортсмены</th>
                  <th>Очки</th>
                  <th>Статус</th>
                </tr>
              </thead>
              <tbody>
        `;

        teams.forEach((team, index) => {
          const playerCount = team.players ? team.players.length : 0;
          const totalPoints = team.total_points || 0;
          const status = team.is_confirmed 
            ? '<span class="badge badge-success">✅ Подтверждена</span>' 
            : '<span class="badge badge-warning">⏳ Собирается</span>';
          
          let place = index + 1;
          let placeDisplay = place;
          if (place === 1) placeDisplay = ' 1';
          else if (place === 2) placeDisplay = '🥈 2';
          else if (place === 3) placeDisplay = '🥉 3';
          
          const rowStyle = place === 1 ? 'background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);' : '';
          
          html += `
            <tr style="${rowStyle}">
              <td><strong style="font-size: 18px;">${placeDisplay}</strong></td>
              <td>
                <strong>${team.user_name}</strong>
                <br>
                <small style="color: var(--text-muted);">
                  Создана: ${formatDate(team.created_at)}
                </small>
              </td>
              <td>
                <span style="font-weight: 600; color: ${playerCount === 8 ? 'var(--success)' : 'var(--warning)'};">
                  ${playerCount}/8
                </span>
              </td>
              <td>
                <strong style="font-size: 20px; color: var(--primary);">
                  ${totalPoints}
                </strong>
              </td>
              <td>${status}</td>
            </tr>
          `;
        });

        html += `
              </tbody>
            </table>
          </div>
        `;
      }

      html += '</div>';
      return html;
    }

    // Очистка интервала при уходе со страницы
    window.addEventListener('beforeunload', () => {
      if (refreshInterval) {
        clearInterval(refreshInterval);
      }
    });

    // Запуск
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
