<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рейтинги - Фэнтези Лига</title>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="loadingScreen">
      <div style="font-size: 28px; margin-bottom: 20px;">⏳ Загрузка...</div>
      <div class="spinner"></div>
      <p style="font-size: 16px; opacity: 0.9;">Подключение к VK</p>
    </div>

    <div id="mainContent" class="hidden">
      <div class="header">
        <div>
          <h1>🏅 Рейтинги</h1>
          <p class="subtitle">Спортивный туризм</p>
        </div>
        <nav class="nav">
          <a href="/">🏠 Главная</a>
          <a href="/events.html">📅 События</a>
          <a href="/admin.html" id="adminLink" class="hidden">⚙️ Админ</a>
        </nav>
      </div>

      <!-- Общий рейтинг спортсменов -->
      <div class="card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
        <h2 style="color: white; margin-bottom: 20px;">🏆 Общий рейтинг спортсменов</h2>
        <p style="color: rgba(255,255,255,0.9); margin-bottom: 20px;">
          Сумма очков по всем активным событиям
        </p>
        <div id="overallRating"></div>
      </div>

      <!-- Рейтинги по событиям -->
      <div id="eventRankings"></div>
    </div>
  </div>

  <script>
    let vkUserInfo = null;
    let events = [];
    let refreshInterval = null;

    function formatDate(dateString) {
      if (!dateString) return 'Не указана';
      try {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return 'Не указана';
        return date.toLocaleDateString('ru-RU', {
          day: '2-digit', month: '2-digit', year: 'numeric'
        });
      } catch (e) {
        return 'Не указана';
      }
    }

    async function init() {
      try {
        try {
          await vkBridge.send('VKWebAppInit', {});
          const userData = await vkBridge.send('VKWebAppGetUserInfo', {});
          vkUserInfo = userData;
        } catch (vkError) {
          vkUserInfo = { id: 416323498, first_name: 'Тест', last_name: 'Пользователь' };
        }

        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');

        if (vkUserInfo.id === 416323498) {
          document.getElementById('adminLink').classList.remove('hidden');
        }

        await loadAllRankings();
        
        refreshInterval = setInterval(() => {
          loadAllRankings();
        }, 5000);
        
      } catch (error) {
        console.error('Ошибка инициализации:', error);
      }
    }

    async function loadAllRankings() {
      await loadOverallRating();
      await loadEventRankings();
    }

    // Загрузка общего рейтинга спортсменов
    async function loadOverallRating() {
      try {
        const res = await fetch('/api/players/overall-rating');
        const rating = await res.json();

        const container = document.getElementById('overallRating');
        
        if (!rating || rating.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 30px; background: rgba(255,255,255,0.1); border-radius: 12px;">
              <div style="font-size: 48px; margin-bottom: 10px;"></div>
              <p style="color: rgba(255,255,255,0.9);">Пока нет начисленных очков</p>
            </div>
          `;
          return;
        }

        let html = `
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Место</th>
                  <th>Спортсмен</th>
                  <th>Регион</th>
                  <th>Разряд</th>
                  <th>Событий</th>
                  <th>Очки</th>
                </tr>
              </thead>
              <tbody>
        `;

        rating.forEach((player, index) => {
          let place = index + 1;
          let placeDisplay = place;
          if (place === 1) placeDisplay = '🥇 1';
          else if (place === 2) placeDisplay = '🥈 2';
          else if (place === 3) placeDisplay = '🥉 3';

          const rowStyle = place === 1 ? 'background: rgba(255,215,0,0.2);' : '';

          html += `
            <tr style="${rowStyle}">
              <td><strong style="font-size: 18px;">${placeDisplay}</strong></td>
              <td>
                <strong>${player.full_name}</strong>
                <br>
                <small style="opacity: 0.8;">${player.birth_year} г.р. • ${player.gender === 'male' ? '♂' : '♀'}</small>
              </td>
              <td>${player.team}</td>
              <td><span class="badge badge-primary">${player.rank || '-'}</span></td>
              <td>${player.events_count}</td>
              <td>
                <strong style="font-size: 20px;">${player.total_points}</strong>
              </td>
            </tr>
          `;
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;

      } catch (error) {
        console.error('Ошибка загрузки общего рейтинга:', error);
      }
    }

    // Загрузка рейтингов по событиям
    async function loadEventRankings() {
      try {
        const eventsRes = await fetch('/api/events');
        events = await eventsRes.json();

        const container = document.getElementById('eventRankings');
        
        if (!events || events.length === 0) {
          container.innerHTML = `
            <div class="card" style="text-align: center; padding: 60px 20px;">
              <div style="font-size: 64px; margin-bottom: 20px;">📭</div>
              <h3 style="color: var(--text-primary);">Нет событий</h3>
            </div>
          `;
          return;
        }

        let html = '';
        
        for (const event of events) {
          try {
            const teamsRes = await fetch(`/api/events/${event.id}/teams`);
            const teams = await teamsRes.json();
            
            html += renderEventRanking(event, teams);
          } catch (error) {
            html += renderEventRanking(event, []);
          }
        }
        
        container.innerHTML = html;
        
      } catch (error) {
        console.error('Ошибка:', error);
      }
    }

    function renderEventRanking(event, teams) {
      const statusBadge = event.status === 'active' 
        ? '<span class="badge badge-success">🔥 Активно</span>'
        : '<span class="badge badge-info">⏸ Завершено</span>';

      let html = `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <h2 style="margin: 0;">🏆 ${event.name}</h2>
            ${statusBadge}
          </div>
          <p style="color: var(--text-secondary); margin-bottom: 5px;">
            📅 ${formatDate(event.event_start_date)} — ${formatDate(event.event_end_date)}
          </p>
      `;

      if (!teams || teams.length === 0) {
        html += `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            <div style="font-size: 48px; margin-bottom: 15px;">🏆</div>
            <p>Пока нет команд</p>
          </div>
        `;
      } else {
        html += `
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Место</th>
                  <th>Команда</th>
                  <th>Спортсмены</th>
                  <th>Очки</th>
                  <th>Статус</th>
                </tr>
              </thead>
              <tbody>
        `;

        teams.forEach((team, index) => {
          const playerCount = team.players ? team.players.length : 0;
          const totalPoints = team.total_points || 0;
          const status = team.is_confirmed 
            ? '<span class="badge badge-success">✅ Подтверждена</span>' 
            : '<span class="badge badge-warning">⏳ Собирается</span>';
          
          let place = index + 1;
          let placeDisplay = place;
          if (place === 1) placeDisplay = '🥇 1';
          else if (place === 2) placeDisplay = '🥈 2';
          else if (place === 3) placeDisplay = ' 3';
          
          const rowStyle = place === 1 ? 'background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);' : '';
          
          html += `
            <tr style="${rowStyle}">
              <td><strong style="font-size: 18px;">${placeDisplay}</strong></td>
              <td><strong>${team.user_name}</strong></td>
              <td>${playerCount}/8</td>
              <td><strong style="font-size: 20px; color: var(--primary);">${totalPoints}</strong></td>
              <td>${status}</td>
            </tr>
          `;
        });

        html += '</tbody></table></div>';
      }

      html += '</div>';
      return html;
    }

    window.addEventListener('beforeunload', () => {
      if (refreshInterval) clearInterval(refreshInterval);
    });

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
